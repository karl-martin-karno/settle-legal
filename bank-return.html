<style>
:root { color-scheme: light dark; --bg: #F5F2EE; --card: #FFFFFF; --text: #1F1F1F; --muted: #626B68; --line: #DADADA; --accent: #0E3A32; --label: #626B68; --eyebrow: #C9C4BC; --hero-bg: #0E3A32; --hero-text: #F5F2EE; --hero-edge: transparent; }
@media (prefers-color-scheme: dark) { :root { --bg: #121514; --card: #1D2523; --text: #F5F2EE; --muted: #AAB8B2; --line: #2F3836; --accent: #74B5A2; --label: #AAB8B2; --eyebrow: #74B5A2; --hero-bg: #1D2523; --hero-text: #F5F2EE; --hero-edge: #2F3836; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 2rem; line-height: 1.2; font-weight: 600; }
h2 { margin-top: 2rem; font-size: 1.25rem; }
a { color: var(--accent); }
nav { display: flex; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
.home main { max-width: 640px; padding-top: 32px; }
.hero { background: var(--hero-bg); color: var(--hero-text); border: 1px solid var(--hero-edge); border-radius: 24px; padding: 28px 24px 30px; }
.hero .logo { display: block; width: 56px; height: 56px; margin-bottom: 20px; }
.hero .eyebrow { margin: 0; color: var(--eyebrow); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
.hero h1 { margin: 6px 0 8px; font-size: 3.25rem; line-height: 1.05; }
.hero p { margin: 0 0 12px; font-size: 1.05rem; }
.hero p:last-child { margin-bottom: 0; opacity: 0.85; font-size: 0.95rem; }
.label { margin: 32px 0 8px 4px; color: var(--label); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(31, 31, 31, 0.06); }
.card p { margin: 0 0 12px; }
.card p:last-child, .card ul:last-child { margin-bottom: 0; }
.card ul { margin: 0 0 12px; padding-left: 20px; }
.card li { margin-bottom: 6px; }
</style>
</head>
<body class="return">
<main>
<div class="card">
<p><strong>Returning to Erana…</strong></p>
<p>If the app does not open by itself, <a id="open" href="erana://bank-callback">open Erana</a>.</p>
</div>
<script>
var params = new URLSearchParams(location.search);
var forward = new URLSearchParams();
['code', 'state', 'error', 'error_description'].forEach(function (key) {
  if (params.get(key)) {
    forward.set(key, params.get(key));
  }
});
var target = 'erana://bank-callback?' + forward.toString();
document.getElementById('open').href = target;
location.replace(target);
</script>
</main>
</body>
</html>
