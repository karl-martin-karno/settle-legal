<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returning to Erana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%201024%201024%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22230%22%20style%3D%22fill%3A%230B6E4F%22%2F%3E%3Cpath%20d%3D%22M630%20320H400V704H630M400%20512H590%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2280%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex, nofollow">
<style>
:root { color-scheme: light dark; --bg: #F7F4EE; --card: #FFFFFF; --text: #101828; --muted: #667085; --line: #D9D3C5; --accent: #0B6E4F; --gold: #8A6414; --hero-bg: #0B6E4F; --hero-text: #FFFFFF; --hero-edge: transparent; --logo-bg: rgba(255,255,255,0.16); }
@media (prefers-color-scheme: dark) { :root { --bg: #101513; --card: #1A221F; --text: #F3F5F4; --muted: #98A29D; --line: #26302C; --accent: #3DB88A; --gold: #E8C872; --hero-bg: #1A221F; --hero-text: #F3F5F4; --hero-edge: #E8C872; --logo-bg: #3DB88A; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-family: Georgia, serif; font-size: 2rem; line-height: 1.2; }
h2 { margin-top: 2rem; font-size: 1.25rem; }
a { color: var(--accent); }
nav { display: flex; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
.home main { max-width: 640px; padding-top: 32px; }
.hero { background: var(--hero-bg); color: var(--hero-text); border: 1px solid var(--hero-edge); border-radius: 28px; padding: 28px 24px 30px; }
.hero .logo { display: block; width: 56px; height: 56px; margin-bottom: 20px; }
.hero .eyebrow { margin: 0; color: #E8C872; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
.hero h1 { margin: 6px 0 8px; font-size: 3.25rem; line-height: 1.05; }
.hero p { margin: 0 0 12px; font-size: 1.05rem; }
.hero p:last-child { margin-bottom: 0; opacity: 0.85; font-size: 0.95rem; }
.label { margin: 32px 0 8px 4px; color: var(--gold); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(16, 24, 40, 0.06); }
.card p { margin: 0 0 12px; }
.card p:last-child, .card ul:last-child { margin-bottom: 0; }
.card ul { margin: 0 0 12px; padding-left: 20px; }
.card li { margin-bottom: 6px; }
</style>
</head>
<body class="return">
<main>
<div class="card">
<p><strong>Returning to Erana…</strong></p>
<p>If the app does not open by itself, <a id="open" href="erana://bank-callback">open Erana</a>.</p>
</div>
<script>
var params = new URLSearchParams(location.search);
var forward = new URLSearchParams();
['code', 'state', 'error', 'error_description'].forEach(function (key) {
  if (params.get(key)) {
    forward.set(key, params.get(key));
  }
});
var target = 'erana://bank-callback?' + forward.toString();
document.getElementById('open').href = target;
location.replace(target);
</script>
</main>
</body>
</html>
